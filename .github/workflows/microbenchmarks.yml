name: JMH

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  jmh-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Run every shard twice: with the default MapCache and with the PooledMapCache. MapCacheFactory
        # selects the implementation from the AERON_CACHE_POOLING_ENABLED env var, which the forked
        # JMH JVMs inherit from the Gradle step below.
        pooling: [unpooled, pooled]
        mode: [throughput]
        # Shard the run across parallel jobs so wall-clock stays low. The two shards are split by
        # package: counter benchmarks live in ...cache.counters.*, everything else is a cache
        # benchmark. See build.gradle.kts for the -PjmhIncludes / -PjmhExcludes filters.
        # The codec benchmarks (...codecs.*) have their own pooling-independent workflow
        # (microbenchmarks-codecs.yml), so the cache shard excludes them as well as the counters.
        shard:
          - name: cache
            args: "-PjmhExcludes=.*counters.*,.*codecs.*"
          - name: counters
            args: "-PjmhIncludes=.*counters.*"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # A quick regression signal on every push/PR: short 5s warmup + 5s measurement, single fork.
      # For longer, publishable numbers trigger the "JMH Full" workflow manually.
      - name: Run JMH benchmark (${{ matrix.shard.name }}, ${{ matrix.pooling }})
        env:
          AERON_CACHE_POOLING_ENABLED: ${{ matrix.pooling == 'pooled' }}
        run: >-
          ./gradlew :cache-integration:microbenchmarks:jmh
          -PjmhMode=${{ matrix.mode }}
          -PjmhWarmup=5s
          -PjmhTime=5s
          "${{ matrix.shard.args }}"

      - name: Rename and Prepare Artifact
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          mv cache-integration/microbenchmarks/build/reports/jmh/results.json "cache-integration/microbenchmarks/build/reports/jmh/${SHA}-${{ matrix.mode }}-${{ matrix.shard.name }}-${{ matrix.pooling }}.json"

      - name: Upload JMH Results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results-${{ matrix.mode }}-${{ matrix.shard.name }}-${{ matrix.pooling }}
          path: cache-integration/microbenchmarks/build/reports/jmh/${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.mode }}-${{ matrix.shard.name }}-${{ matrix.pooling }}.json
