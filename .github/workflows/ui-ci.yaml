name: UI CI

on:
  push:
    branches: [ main ]
    paths:
      - 'cache-ui/nextjs/**'
      - 'cache-monolith/**'
      - 'cache-common/**'
      - 'cache-spi/**'
      - 'cache-spi-impl/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'cache-ui/nextjs/**'
      - 'cache-monolith/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build Backend Monolith Shadow JAR
        run: ./gradlew :cache-monolith:shadowJar
      - name: Upload Backend Jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: cache-monolith/build/libs/*-all.jar

  ui-build-and-test:
    needs: build-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cache-ui/nextjs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cache-ui/nextjs/package-lock.json

      - name: Set up JDK 25 (to run backend)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download Backend Jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: cache-monolith/build/libs

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Start Backend
        run: |
          # Use the dev-monolith config
          cd ../../cache-monolith
          chmod +x run_with_env.sh
          ./run_with_env.sh ../config/dev-monolith.env > backend.log 2>&1 &
          
          # Wait for the UI env file to be generated (indicates backend is ready)
          echo "Waiting for backend to generate aeron-cache-ui.env..."
          TIMEOUT=60
          while [ ! -f aeron-cache-ui.env ] && [ $TIMEOUT -gt 0 ]; do
            sleep 1
            ((TIMEOUT--))
          done
          
          if [ ! -f aeron-cache-ui.env ]; then
            echo "Backend failed to start or generate config"
            cat backend.log
            exit 1
          fi
          
          # Copy generated env to UI directory
          cp aeron-cache-ui.env ../cache-ui/nextjs/.env
          echo "Backend started and .env initialized"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: cache-ui/nextjs/playwright-report/
          retention-days: 30
      
      - name: Export Backend Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: cache-monolith/backend.log
