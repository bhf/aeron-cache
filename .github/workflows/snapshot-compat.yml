name: Snapshot Compatibility

# Boots the CURRENT build against cache-data artifacts captured by OLDER releases and asserts every
# known fixture value still recovers from the snapshot. Green means the snapshot format is backward
# compatible from those releases to HEAD.
#
# Two trigger modes:
#   * pull_request - runs automatically against the most recent releases that are STRICTLY OLDER
#     than the build under test (the newest `count` of them, default 3), so a PR that breaks
#     snapshot restore from a real earlier release is flagged. "Strictly older" is the point: the
#     current line's own release (e.g. v0.0.44-SNAPSHOT while gradle.properties is still
#     0.0.44-SNAPSHOT) is skipped, because a build always restores its own snapshot and that
#     diagonal cell is meaningless - it is what made the matrix look like it was testing a version
#     against itself. A break is NON-BLOCKING: some changes break compatibility by design, so the
#     "Restore And Assert" step is continue-on-error and the real pass/fail is recorded in the
#     uploaded result artifact rather than failing the check. (Keep this workflow out of the
#     required status checks in branch protection so it can never block a merge.)
#   * workflow_dispatch - pass a space-separated list of release tags to test against instead, e.g.
#     "v1.0.0 v1.1.0" (handy for backfilling the matrix across many historical releases in a single
#     run), or leave it blank to use the same auto-selection a PR uses. The `count` input tunes how
#     many older releases that auto-selection covers.
#
# Each tested tag must have a cache-data-<tag>.tar.gz asset (produced by the release workflow);
# in auto mode, releases without that asset are skipped automatically.
#
# Every run uploads a snapshot-compat-<sha>-<from>.json result artifact (one per tested release),
# whether the restore passed or failed. The aeron-cache-site repo aggregates these across runs into
# a release-to-release compatibility matrix, the same way it builds the JMH dashboard from the
# jmh-results-* artifacts.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space-separated release tags to test against the current build (blank = auto-select older releases)'
        required: false
        default: ''
      count:
        description: 'Auto mode only: how many of the newest releases older than the current build to test against'
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR / ref so only the newest commit is tested.
  group: snapshot-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      # Needed so the current build version can be read from gradle.properties: "test against
      # releases older than THIS version" is what keeps the current line's own release out of the
      # matrix. On a PR this is the PR-merged-into-main tree, matching the restore job's "to" side.
      - uses: actions/checkout@v4

      - id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSIONS: ${{ github.event.inputs.versions }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          # "to" side of every edge: the version of the build under test (gradle.properties). Tags
          # carry a leading "v" (v0.0.44-SNAPSHOT) while gradle.properties does not (0.0.44-SNAPSHOT),
          # so compare on the bare form (${tag#v}) throughout.
          CURRENT=$(grep -E '^version=' gradle.properties | cut -d= -f2)
          COUNT="${COUNT:-3}"
          [ -n "$COUNT" ] || COUNT=3

          if [ -n "$VERSIONS" ]; then
            # Explicit dispatch list wins, taken verbatim and in the given order.
            CANDIDATES=$(echo "$VERSIONS" | tr ', ' '\n\n' | grep -v '^[[:space:]]*$' || true)
          else
            # Auto mode: the newest COUNT releases that (a) actually ship a cache-data-<tag>.tar.gz
            # asset to restore from, and (b) are STRICTLY OLDER than the build under test. (b) is the
            # fix for the self-test: without it, "latest release" resolves to the current line's own
            # -SNAPSHOT release and every cell is a build restoring its own snapshot.
            WITH_DATA=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | select([.assets[].name] | any(test("^cache-data-.*\\.tar\\.gz$"))) | .tag_name' \
              2>/dev/null || true)
            CANDIDATES=$(printf '%s\n' "$WITH_DATA" | sort -Vr | while read -r tag; do
              [ -z "$tag" ] && continue
              bare="${tag#v}"
              [ "$bare" = "$CURRENT" ] && continue
              # bare < CURRENT iff the smaller of the two (version sort) is bare.
              smaller=$(printf '%s\n%s\n' "$bare" "$CURRENT" | sort -V | head -1)
              [ "$smaller" = "$bare" ] && echo "$tag"
            done | head -n "$COUNT")
          fi

          # Final guard, applied to both paths: never test a build against a snapshot captured by its
          # own version (from == to). That diagonal cell is always green and tells you nothing.
          SELECTED=$(printf '%s\n' "$CANDIDATES" | while read -r tag; do
            [ -z "$tag" ] && continue
            if [ "${tag#v}" = "$CURRENT" ]; then
              echo "::warning::Skipping $tag: same version as the build under test ($CURRENT); a build always restores its own snapshot." >&2
              continue
            fi
            echo "$tag"
          done)

          MATRIX=$(printf '%s\n' "$SELECTED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          [ -n "$MATRIX" ] || MATRIX='[]'
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Build under test: $CURRENT"
          echo "Testing against:  $MATRIX"

  restore:
    needs: prepare-matrix
    # Skip cleanly when there is nothing to test against (empty matrix).
    if: needs.prepare-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Resolve Current Version
        # The "to" side of the compatibility edge: the version of the build under test. On a PR this
        # is the in-development snapshot from gradle.properties; the head SHA pins the exact commit.
        id: current
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Pull Jib Base Image
        # The Jib config references the base as docker://eclipse-temurin:25-jre, which loads it from
        # the local daemon, so it must be pulled first.
        run: docker pull eclipse-temurin:25-jre

      - name: Build Current Backend Images
        # The restore harness boots node + http from the current build, and runs ClusterTool from the
        # cluster image to reseed the recording log from the snapshot.
        run: |
          ./gradlew :cache-cluster:jibDockerBuild \
                    :cache-http:http-server-javalin:jibDockerBuild

      - name: Download Old Cache Data Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ matrix.version }}" \
            --repo "${{ github.repository }}" \
            --pattern 'cache-data-*.tar.gz' \
            --dir artifacts
          echo "ARTIFACT=$(ls artifacts/cache-data-*.tar.gz | head -1)" >> "$GITHUB_ENV"

      - name: Restore And Assert
        id: restore
        # Non-blocking: a failure here means the current build cannot load the older snapshot. That
        # may be an intentional format break, so it must not fail the check - the outcome is recorded
        # in the result artifact below and surfaced in the site's compatibility matrix instead.
        continue-on-error: true
        run: |
          ./gradlew :cache-integration:clustered:snapshot-restore-tests:test \
            -PskipIntegrationTests=false \
            -Dsnapshot.restore.artifact="$PWD/$ARTIFACT"

      - name: Record Compatibility Result
        # Always emit a result, pass or fail, so the matrix has a cell for every edge we tested.
        if: always()
        run: |
          COMPATIBLE=$([ "${{ steps.restore.outcome }}" = "success" ] && echo true || echo false)
          mkdir -p compat-results
          OUT="compat-results/snapshot-compat-${{ steps.current.outputs.sha }}-${{ matrix.version }}.json"
          jq -c -n \
            --arg schema "snapshot-compat/v1" \
            --arg from "${{ matrix.version }}" \
            --arg to "${{ steps.current.outputs.version }}" \
            --arg toSha "${{ steps.current.outputs.sha }}" \
            --argjson compatible "$COMPATIBLE" \
            --arg event "${{ github.event_name }}" \
            --arg pr "${{ github.event.pull_request.number }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "${{ github.run_id }}" \
            --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              schema: $schema,
              from: $from,
              to: $to,
              toSha: $toSha,
              compatible: $compatible,
              event: $event,
              prNumber: (if $pr == "" then null else ($pr | tonumber) end),
              timestamp: $timestamp,
              runId: $runId,
              runUrl: $runUrl
            }' > "$OUT"
          echo "Wrote $OUT:"
          cat "$OUT"

      - name: Upload Compatibility Result
        # The aeron-cache-site dashboard build downloads these across runs to assemble the matrix.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-compat-${{ matrix.version }}
          path: compat-results/snapshot-compat-${{ steps.current.outputs.sha }}-${{ matrix.version }}.json

      - name: Upload Test Report On Failure
        if: steps.restore.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: restore-report-${{ matrix.version }}
          path: cache-integration/clustered/snapshot-restore-tests/build/reports/tests/test
