name: JMH Codecs

# Dedicated JMH workflow for the request/response codec benchmarks (com.bhf.aeroncache.codecs.*).
#
# These measure the SBE encode/decode paths in isolation, so unlike the cache/counter benchmarks they are
# pooling-independent (the pooled vs unpooled split only affects the MapCache, not the codecs) and there is
# no pooling matrix here. The run is instead sharded by codec direction so the four directions run in
# parallel. The main "JMH" workflow excludes .*codecs.* so these do not run twice.
#
# On push/PR this gives a quick regression signal (short 5s warmup + 5s measurement, single fork). Trigger
# it manually (workflow_dispatch) to override the run parameters for longer, publishable numbers.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      warmup:
        description: 'Warmup time per iteration (e.g. 10s)'
        type: string
        default: '5s'
      warmupIterations:
        description: 'Number of warmup iterations'
        type: string
        default: '1'
      measurementTime:
        description: 'Measurement time per iteration (e.g. 10s)'
        type: string
        default: '5s'
      measurementIterations:
        description: 'Number of measurement iterations'
        type: string
        default: '1'
      forks:
        description: 'Number of JVM forks'
        type: string
        default: '1'

jobs:
  jmh-codec-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One shard per codec interface / direction so they run in parallel. See build.gradle.kts for the
        # -PjmhIncludes filter.
        shard:
          - name: request-encode
            args: "-PjmhIncludes=.*CacheRequestEncoderBenchmark.*"
          - name: request-decode
            args: "-PjmhIncludes=.*CacheRequestDecoderBenchmark.*"
          - name: response-encode
            args: "-PjmhIncludes=.*CacheResponseEncoderBenchmark.*"
          - name: response-decode
            args: "-PjmhIncludes=.*CacheResponseDecoderBenchmark.*"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # Defaults give the quick per-PR signal; workflow_dispatch inputs override them for longer runs.
      - name: Run JMH codec benchmark (${{ matrix.shard.name }})
        run: >-
          ./gradlew :cache-integration:microbenchmarks:jmh
          -PjmhMode=throughput
          -PjmhWarmup=${{ github.event.inputs.warmup || '5s' }}
          -PjmhWarmupIterations=${{ github.event.inputs.warmupIterations || '1' }}
          -PjmhTime=${{ github.event.inputs.measurementTime || '5s' }}
          -PjmhIterations=${{ github.event.inputs.measurementIterations || '1' }}
          -PjmhForks=${{ github.event.inputs.forks || '1' }}
          "${{ matrix.shard.args }}"

      - name: Rename and Prepare Artifact
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          mv cache-integration/microbenchmarks/build/reports/jmh/results.json "cache-integration/microbenchmarks/build/reports/jmh/${SHA}-codecs-${{ matrix.shard.name }}.json"

      - name: Upload JMH Results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results-codecs-${{ matrix.shard.name }}
          path: cache-integration/microbenchmarks/build/reports/jmh/${{ github.event.pull_request.head.sha || github.sha }}-codecs-${{ matrix.shard.name }}.json
