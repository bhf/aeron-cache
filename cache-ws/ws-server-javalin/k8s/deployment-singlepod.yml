apiVersion: v1
kind: Pod
metadata:
  name: aeroncache-ws
  labels:
    run: aeroncache-ws
spec:
  serviceAccountName: aeroncache-ws
  volumes:
    - emptyDir:
        medium: Memory
        sizeLimit: 1Gi
      name: shm
  containers:
    - name: aeroncache-http
      image: docker.io/library/aeroncache-ws
      imagePullPolicy: Never
      ports:
      - containerPort: 7070
        protocol: TCP
      volumeMounts:
        - mountPath: /dev/shm
          name: shm
      env:
        - name: DNS_DELAY
          value: "true"
        - name: CLUSTER_ADDRESSES
          value: aeroncache-cluster-0.aeroncache-cluster.default.svc.cluster.local,aeroncache-cluster-1.aeroncache-cluster.default.svc.cluster.local,aeroncache-cluster-2.aeroncache-cluster.default.svc.cluster.local
        - name: POD_ADDRESS
          value: 127.0.0.1