[versions]
aeron = "1.46.2"
sbetool = "1.33.0"
lombok = "1.18.34"
log4j = "2.24.0"
junit = "5.9.1"
sbegenerator = "0.0.9"
lombokplugin = "8.10"
jmhplugin = "0.7.2"
mockito = "5.16.1"
shadow = "7.1.2"
javalin = "6.4.0"
restassured = "5.5.1"
slf4j = "2.0.16"
jackson = "2.17.2"
opentelemetry = "1.49.0"
micrometer = "1.14.6"
micrometer-javalin = "6.6.0"

[libraries]
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
slf4j = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
aeron = { module = "io.aeron:aeron-all", version.ref = "aeron" }
sbetool = { module = "uk.co.real-logic:sbe-tool", version.ref = "sbetool" }
junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
restassured = { module = "io.rest-assured:rest-assured", version.ref = "restassured"}
jackson-core = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson"}
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry"}
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry"}
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry"}
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer"}
micrometer-javalin = { module = "io.javalin:javalin-micrometer", version.ref = "micrometer-javalin"}

[plugins]
sbegenerator = { id = "com.github.vontikov.sbe-generator-plugin", version.ref = "sbegenerator" }
lombok = { id = "io.freefair.lombok", version.ref = "lombokplugin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhplugin" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }

[bundles]
