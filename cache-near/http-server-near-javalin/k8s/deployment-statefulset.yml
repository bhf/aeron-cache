apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aeroncache-http-near
  namespace: default
  labels:
    app.kubernetes.io/name: aeroncache-http-near
    app.kubernetes.io/instance: aeroncache-http-near
spec:
  replicas: 1
  podManagementPolicy: Parallel
  serviceName: aeroncache-http-near
  selector:
    matchLabels:
      app.kubernetes.io/name: aeroncache-http-near
      app.kubernetes.io/instance: aeroncache-http-near
  template:
    metadata:
      annotations:
        {}
      labels:
        app.kubernetes.io/name: aeroncache-http-near
        app.kubernetes.io/instance: aeroncache-http-near
    spec:
      serviceAccountName: aeroncache-http-near
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 1Gi
          name: shm
      containers:
        - name: aeroncache-http-near
          image: docker.io/library/aeroncache-http-near-javalin
          imagePullPolicy: Never
          ports:
            - containerPort: 7070
              protocol: TCP
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
          env:
            - name: POD_ADDRESS
              value: 127.0.0.1
          envFrom:
            - configMapRef:
                name: aeroncache-http-near-config