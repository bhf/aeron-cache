scrape_configs:
  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets:
          - cadvisor:8080
  - job_name: cache-http
    scrape_interval: 5s
    static_configs:
      - targets:
          - cache-http-client:7070
    metrics_path: /prometheus
  - job_name: cache-ws
    scrape_interval: 5s
    static_configs:
      - targets:
          - cache-ws-client:7071
    metrics_path: /prometheus