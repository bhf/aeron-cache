apiVersion: v1
kind: Service
metadata:
  name: {{ include "aeroncache-http-fanout.fullname" . }}
  labels:
    {{- include "aeroncache-http-fanout.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort") }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  # The aggregator is stateless (pure HTTP, no Aeron), so the Service load-balances across every
  # replica via the selector labels rather than pinning to a single StatefulSet pod.
  selector:
    {{- include "aeroncache-http-fanout.selectorLabels" . | nindent 4 }}
