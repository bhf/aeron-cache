apiVersion: v1
kind: ConfigMap
metadata:
  # Name comes from the shared configmapName helper (default "<fullname>-config"), which the
  # Deployment also reads via envFrom, so producer and consumer stay in sync and one fan-out
  # aggregator can be installed per set of gateways in a single namespace.
  name: {{ include "aeroncache-http-fanout.configmapName" . }}
  namespace: {{ .Release.namespace }}
data:
  GATEWAY_ADDRESSES: {{ tpl .Values.gatewayAddresses . | quote }}
  HTTP_PORT: {{ .Values.service.port | quote }}
  {{- if .Values.requestTimeoutMs }}
  REQUEST_TIMEOUT_MS: {{ .Values.requestTimeoutMs | quote }}
  {{- end }}
  {{- if .Values.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ tpl .Values.corsAllowedOrigins . | quote }}
  {{- end }}
