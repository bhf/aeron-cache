apiVersion: v1
kind: ConfigMap
metadata:
  # Name comes from the shared configmapName helper (default "<fullname>-config"), which the
  # Deployment also reads via envFrom, so producer and consumer stay in sync and one gateway
  # can be installed per cache instance in a single namespace.
  name: {{ include "aeroncache-gateway.configmapName" . }}
  namespace: {{ .Release.Namespace }}
data:
  DNS_DELAY: "true"
  CACHE_MODE: {{ tpl .Values.cacheMode . | quote }}
  CLUSTER_ADDRESSES: {{ tpl .Values.clusterAddresses . | quote }}
  REQUEST_PUB_HOST: {{ tpl .Values.requestPubHost . | quote }}
  GATEWAY_REQUEST_ENDPOINT: {{ tpl .Values.gatewayRequestEndpoint . | quote }}
  GATEWAY_RESPONSE_CONTROL_ENDPOINT: {{ tpl .Values.gatewayResponseControlEndpoint . | quote }}
  {{- if .Values.ephemeralRequestEndpoint }}
  EPHEMERAL_REQUEST_ENDPOINT: {{ tpl .Values.ephemeralRequestEndpoint . | quote }}
  EPHEMERAL_RESPONSE_CONTROL_ENDPOINT: {{ tpl .Values.ephemeralResponseControlEndpoint . | quote }}
  AERON_IMAGE_LIVENESS_TIMEOUT_SECONDS: {{ .Values.aeronImageLivenessTimeoutSeconds | default "2" | quote }}
  {{- end }}
  {{- if .Values.idleStrategy }}
  IDLE_STRATEGY: {{ tpl .Values.idleStrategy . | quote }}
  {{- end }}
  {{- if .Values.nearCacheEnabled }}
  NEAR_CACHE_ENABLED: "true"
  {{- end }}
  {{- printf "environments/configmap.%s.yaml" .Values.env | .Files.Get | nindent 2 }}
