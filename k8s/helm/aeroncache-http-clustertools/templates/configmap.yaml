apiVersion: v1
kind: ConfigMap
metadata:
  name: aeroncache-http-clustertools-config
  namespace: {{ .Release.namespace }}
data:
  DNS_DELAY: "true"
  CLUSTER_ADDRESSES: "aeroncache-cluster-0.aeroncache-cluster.{{ .Release.Namespace }}.svc.cluster.local,aeroncache-cluster-1.aeroncache-cluster.{{ .Release.Namespace }}.svc.cluster.local,aeroncache-cluster-2.aeroncache-cluster.{{ .Release.Namespace }}.svc.cluster.local"
  {{- if .Values.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ tpl .Values.corsAllowedOrigins . | quote }}
  {{- end }}
  {{- with .Values.snapshot }}
  SNAPSHOT_SCHEDULE_ENABLED: {{ .scheduleEnabled | quote }}
  SNAPSHOT_INTERVAL: {{ .interval | quote }}
  SNAPSHOT_RETENTION_COUNT: {{ .retentionCount | int64 | quote }}
  SNAPSHOT_CHECK_STRATEGY: {{ .check.strategy | quote }}
  SNAPSHOT_CHECK_POLL_INTERVAL: {{ .check.pollInterval | quote }}
  SNAPSHOT_CHECK_STATE_CHANGE_THRESHOLD: {{ .check.stateChangeThreshold | int64 | quote }}
  SNAPSHOT_CHECK_ARCHIVE_GROWTH_BYTES: {{ .check.archiveGrowthBytes | int64 | quote }}
  {{- if .clusterFolder }}
  CLUSTER_FOLDER: {{ .clusterFolder | quote }}
  {{- end }}
  {{- if .archiveDir }}
  ARCHIVE_DIR: {{ .archiveDir | quote }}
  {{- end }}
  {{- end }}
  {{- printf "environments/configmap.%s.yaml" .Values.env | .Files.Get | nindent 2 }}
