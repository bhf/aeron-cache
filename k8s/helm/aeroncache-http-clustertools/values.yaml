# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# Set the configmap to use for the cluster config
aeroncacheHTTPConfigmap: aeroncache-http-clustertools-config

# Aeron media driver directory the `counters` endpoint scrapes (the directory containing cnc.dat),
# exposed as the AERON_DIR env var. Leave empty to use the Aeron default; it can always be overridden
# per request with `?dir=`. For scraping to work this container must see the media driver's directory
# on disk - mount the driver's /dev/shm (e.g. a shared volume or hostPath) rather than this chart's
# own empty shm volume.
aeronDir: ""

# Comma separated list of allowed CORS origins for the web facing interface. Leave blank to fall
# back to the application default (localhost dev origins).
corsAllowedOrigins: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost"

# In-process scheduled snapshot + purge. This is separate from, and in addition to, any external
# cron that calls the snapshot-and-purge endpoint; the endpoint always runs regardless of the check
# below - the check only gates the scheduled runs.
#
# Disabled by default (matching the application default). Enabling it also requires clusterFolder to
# point at the cluster data directory this sidecar can see on disk.
snapshot:
  # Whether the in-process scheduled snapshot + purge timer runs.
  scheduleEnabled: false
  # How often the ALWAYS strategy takes a snapshot + purge (ISO-8601 duration).
  interval: PT6H
  # Number of most recent snapshots whose log history is retained by the purge.
  retentionCount: 2
  # Cluster data directory (contains recording.log). Required when scheduleEnabled is true. Leave
  # empty to omit the env var.
  clusterFolder: ""
  # Archive directory whose segments are purged. Leave empty to default to a sibling `archive`
  # directory next to clusterFolder.
  archiveDir: ""
  # The strategy deciding whether each scheduled run is worthwhile. Only scheduled runs are gated.
  check:
    # One of:
    #   ALWAYS             - always snapshot on `interval` (original behaviour).
    #   CACHE_STATE_CHANGE - snapshot once enough cache state-changing operations have accrued,
    #                        read from the custom request counters in the media driver.
    #   RECORDING_GROWTH   - snapshot once the archive has grown enough since the last purge.
    strategy: ALWAYS
    # Poll interval for CACHE_STATE_CHANGE and RECORDING_GROWTH (ISO-8601 duration). These evaluate
    # cheaply, so they poll often and only occasionally trigger a snapshot. Ignored by ALWAYS.
    pollInterval: PT5M
    # CACHE_STATE_CHANGE: state-changing operations since the last snapshot before snapshotting.
    stateChangeThreshold: 10000
    # RECORDING_GROWTH: archive growth in bytes since the last purge before snapshotting (256 MiB).
    archiveGrowthBytes: 268435456

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: aeroncache-http-clustertools
  # This sets the pull policy for images.
  pullPolicy: Never
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: "aeroncache-http-clustertools"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "aeroncache-http-clustertools"

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: LoadBalancer
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 7073

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /liveness/
    port: 7073
readinessProbe:
  httpGet:
    path: /readiness/
    port: 7073

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 1Gi
    name: shm

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /dev/shm
    name: shm

nodeSelector: {}

tolerations: []

affinity: {}
