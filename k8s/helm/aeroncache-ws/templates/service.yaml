apiVersion: v1
kind: Service
metadata:
  name: {{ include "aeroncache-ws.fullname" . }}
  labels:
    {{- include "aeroncache-ws.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 7071
      protocol: TCP
      name: http
  selector:
    {{- include "aeroncache-ws.selectorLabels" . | nindent 4 }}
