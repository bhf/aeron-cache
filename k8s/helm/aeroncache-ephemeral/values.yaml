# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# Set the configmap to use for the cluster config
aeroncacheClusterConfigmap: aeroncache-ephemeral-config

# This sets the cache mode for the cluster
cacheMode: "SINGLE"

# Idle strategy for the Aeron and agent threads. One of: backoff, spin, noop, yield,
# sleep-ns[:nanos], sleep-ms[:millis], or a fully qualified IdleStrategy class name. Applies to all
# roles; individual roles can be overridden with IDLE_STRATEGY_<ROLE> environment variables. Leave
# blank to use the application default (backoff).
idleStrategy: "backoff"

# Aeron term buffer length for the single-node cache media driver. The maximum Aeron message size is
# termLength / 8, so 128m is required to support values up to ~16MB (see LargeItemTests). Must match
# the interfaces' term length; without it the node's driver falls back to a 16m term (~2MB max), which
# hangs on larger items (e.g. the 4MB LargeItemTests case). Buffers are sparse, so the resident memory
# cost is small.
aeronCacheTermLength: "128m"

# External Aeron C media driver (aeronmd) sidecar. When enabled, the C driver runs as a native
# sidecar and this app attaches to it as a pure Aeron client (LAUNCH_EMBEDDED=false) instead of
# launching an embedded Java MediaDriver. Both containers share the `shm` volume at aeronDir, and
# the driver's term buffers are sized from aeronCacheTermLength above (single source of truth).
# The app image runs as root, so it can map the driver's CnC/term files even though the driver
# runs as uid 1000; pin both containers to a matching non-root uid via podSecurityContext for a
# hardened deployment.
externalMediaDriver:
  enabled: false
  # Aeron dir shared between the driver and app containers via the `shm` emptyDir.
  aeronDir: /dev/shm/aeron
  # Driver threading mode: SHARED, SHARED_NETWORK, or DEDICATED.
  threadingMode: SHARED
  image:
    repository: aeroncache-media-driver
    pullPolicy: Never
    tag: "latest"
  # Extra AERON_* env for the driver (e.g. AERON_DRIVER_TIMEOUT, *_IDLE_STRATEGY).
  extraEnv: []
  resources: {}

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: aeroncache-cluster
  # This sets the pull policy for images.
  pullPolicy: Never
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

release-name: "aeroncache-ephemeral"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: "aeroncache-ephemeral"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "aeroncache-ephemeral"

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
# Clients connect over Aeron response channels (control-mode=response): a single request endpoint
# accepts any number of clients and responses are routed back to each client's real source address,
# so a virtual ClusterIP is sufficient (no headless per-pod DNS is needed, unlike the old fixed
# per-interface response-host wiring).
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # Aeron request endpoint (UDP) any number of clients dial.
  requestPort: 8075
  # Aeron response control endpoint (UDP) for control-mode=response.
  responseControlPort: 8076

# Aeron response-channel endpoints advertised via the configmap. The request endpoint binds all
# interfaces; the response control endpoint is the address clients subscribe to for responses.
ephemeralRequestEndpoint: "0.0.0.0:8075"
ephemeralResponseControlEndpoint: "aeroncache-ephemeral:8076"

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # livenessProbe:
  # httpGet:
  #     path: /
  #     port: http
  # readinessProbe:
  # httpGet:
  #     path: /
#     port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 1Gi
    name: shm

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /dev/shm
    name: shm

nodeSelector: {}

tolerations: []

affinity: {}
