apiVersion: v1
kind: Service
metadata:
  name: {{ include "aeroncache-ephemeral.fullname" . }}
  labels:
    {{- include "aeroncache-ephemeral.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.requestPort }}
      targetPort: {{ .Values.service.requestPort }}
      protocol: UDP
      name: aeron-req
    - port: {{ .Values.service.responseControlPort }}
      targetPort: {{ .Values.service.responseControlPort }}
      protocol: UDP
      name: aeron-resp
  selector:
    {{- include "aeroncache-ephemeral.selectorLabels" . | nindent 4 }}
