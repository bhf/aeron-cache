apiVersion: v1
kind: Service
metadata:
  name: {{ include "aeroncache-http.fullname" . }}
  labels:
    {{- include "aeroncache-http.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  externalTrafficPolicy: Local
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    statefulset.kubernetes.io/pod-name: {{ include "aeroncache-http.fullname" . }}-0

