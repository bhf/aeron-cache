apiVersion: v1
kind: ConfigMap
metadata:
  # Name is driven by the same value the Deployment reads via envFrom, so producer and consumer
  # stay in sync and several cluster releases can coexist in one namespace, each owning its config.
  name: {{ .Values.aeroncacheClusterConfigmap }}
  namespace: {{ .Release.Namespace }}
data:
  DNS_DELAY: "true"
  CACHE_MODE: {{ .Values.cacheMode | quote }}
  # The RAFT peer list is derived from this release's own headless Service (the chart fullname)
  # and replicaCount, so the node count is honoured and each release resolves its own peers.
  {{- $fullname := include "aeroncache-cluster.fullname" . -}}
  {{- $ns := .Release.Namespace -}}
  {{- $addrs := list -}}
  {{- range $i := until (int .Values.replicaCount) -}}
  {{- $addrs = append $addrs (printf "%s-%d.%s.%s.svc.cluster.local" $fullname $i $fullname $ns) -}}
  {{- end }}
  CLUSTER_ADDRESSES: {{ $addrs | join "," | quote }}
  {{- if .Values.idleStrategy }}
  IDLE_STRATEGY: {{ tpl .Values.idleStrategy . | quote }}
  {{- end }}
  {{- printf "environments/configmap.%s.yaml" .Values.env | .Files.Get | nindent 2 }}
