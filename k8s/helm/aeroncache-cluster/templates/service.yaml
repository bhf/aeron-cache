apiVersion: v1
kind: Service
metadata:
  name: {{ include "aeroncache-cluster.fullname" . }}
  labels:
    {{- include "aeroncache-cluster.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- if .Values.service.publishNotReadyAddresses }}
  publishNotReadyAddresses: true
  {{- end }}
  selector:
    {{- include "aeroncache-cluster.selectorLabels" . | nindent 4 }}
