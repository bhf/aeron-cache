# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 3

# Set the configmap to use for the cluster config
aeroncacheClusterConfigmap: aeroncache-cluster-config

# Aeron term buffer length for the cache data channels. The maximum Aeron message size is
# termLength / 8, so 128m is required to support values up to ~16MB (see LargeItemTests). Leave
# blank to fall back to the application default (64k). Buffers are sparse, so the resident memory
# cost of a larger term length is small.
aeronCacheTermLength: "128m"

# External Aeron C media driver (aeronmd) sidecar. When enabled, the C driver runs as a native
# sidecar and the cache node (plus its Archive/ConsensusModule/ClusteredService) attaches to it as
# a pure client (LAUNCH_EMBEDDED=false) instead of launching an embedded Java MediaDriver. The
# node, clustertools and driver all share the pod `shm` volume at aeronDir; term buffers are sized
# from aeronCacheTermLength above (single source of truth). The images run as root, so they can map
# the driver's CnC/term files even though the driver runs as uid 1000.
externalMediaDriver:
  enabled: false
  # Aeron dir shared between the driver, node and clustertools containers via the `shm` emptyDir.
  aeronDir: /dev/shm/aeron
  # Driver threading mode: SHARED, SHARED_NETWORK, or DEDICATED.
  threadingMode: SHARED
  image:
    repository: aeroncache-media-driver
    pullPolicy: Never
    tag: "latest"
  # Extra AERON_* env for the driver (e.g. AERON_DRIVER_TIMEOUT, *_IDLE_STRATEGY).
  extraEnv: []
  resources: {}

# This sets the cache mode for the cluster
cacheMode: "RAFT"

# Idle strategy for the Aeron and agent threads. One of: backoff, spin, noop, yield,
# sleep-ns[:nanos], sleep-ms[:millis], or a fully qualified IdleStrategy class name. Applies to all
# roles; individual roles can be overridden with IDLE_STRATEGY_<ROLE> environment variables. Leave
# blank to use the application default (backoff).
idleStrategy: "backoff"

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: aeroncache-cluster
  # This sets the pull policy for images.
  pullPolicy: Never
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

clustertools:
  image:
    repository: aeroncache-http-clustertools
    tag: "latest"
    pullPolicy: Never
  port: 7080
  resources: {}
  livenessProbe:
    httpGet:
      path: /liveness/
      port: 7080
  readinessProbe:
    httpGet:
      path: /readiness/
      port: 7080
  # In-process scheduled snapshot + purge run by the co-located clustertools sidecar. CLUSTER_FOLDER /
  # ARCHIVE_DIR are derived per-node by the sidecar command, so only the scheduling policy is set here.
  # This is separate from any external cron hitting the snapshot-and-purge endpoint; the endpoint always
  # runs regardless - the check below only gates the scheduled runs.
  snapshot:
    # Whether the in-process scheduled snapshot + purge timer runs.
    scheduleEnabled: false
    # How often the ALWAYS strategy takes a snapshot + purge (ISO-8601 duration).
    interval: PT6H
    # Number of most recent snapshots whose log history is retained by the purge.
    retentionCount: 2
    # The strategy deciding whether each scheduled run is worthwhile. Only scheduled runs are gated.
    check:
      # One of:
      #   ALWAYS             - always snapshot on `interval` (original behaviour).
      #   CACHE_STATE_CHANGE - snapshot once enough cache state-changing operations have accrued,
      #                        read from the custom request counters (type 2000) in the media driver.
      #   RECORDING_GROWTH   - snapshot once the archive has grown enough since the last purge.
      strategy: ALWAYS
      # Poll interval for CACHE_STATE_CHANGE and RECORDING_GROWTH (ISO-8601 duration). These evaluate
      # cheaply, so they poll often and only occasionally trigger a snapshot. Ignored by ALWAYS.
      pollInterval: PT5M
      # CACHE_STATE_CHANGE: state-changing operations since the last snapshot before snapshotting.
      stateChangeThreshold: 10000
      # RECORDING_GROWTH: archive growth in bytes since the last purge before snapshotting (256 MiB).
      archiveGrowthBytes: 268435456

release-name: "aeroncache-cluster"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: "aeroncache-cluster"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "aeroncache-cluster"

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
#
# The prometheus.io/* annotations make the aeroncache-observability Prometheus auto-discover and
# scrape the co-located clustertools sidecar, which exports the shared Aeron media driver counters
# (media driver system counters + the cache request counters, type 2000) in Prometheus format on
# /prometheus. One scrape per pod captures everything the driver publishes. The annotations are inert
# if the observability stack is not deployed. The port must match clustertools.port above.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "7080"
  prometheus.io/path: "/prometheus"
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80
  clusterIP: None
  # Publish each cluster pod's DNS address before it is Ready. RAFT nodes must resolve their
  # peers during bootstrap, but a node only becomes Ready after it has connected to the cluster
  # (which needs peer resolution) - so without this, all nodes time out resolving each other and
  # crash-loop. Same reason the ephemeral interface services set it (commit 94fd6c03).
  publishNotReadyAddresses: true

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # livenessProbe:
  # httpGet:
  #     path: /
  #     port: http
  # readinessProbe:
  # httpGet:
  #     path: /
#     port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 1Gi
    name: shm

# Persistence configuration
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  mountPath: /data

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /dev/shm
    name: shm

nodeSelector: {}

tolerations: []

affinity: {}
