apiVersion: v1
kind: Service
metadata:
  name: {{ include "aeroncache-observability.prometheus.fullname" . }}
  labels:
    {{- include "aeroncache-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: {{ .Values.prometheus.service.type }}
  ports:
    - port: {{ .Values.prometheus.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: prometheus
