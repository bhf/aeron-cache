apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aeroncache-observability.grafana.fullname" . }}-provisioning
  labels:
    {{- include "aeroncache-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "aeroncache-observability.prometheus.fullname" . }}:{{ .Values.prometheus.service.port }}
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: aeroncache
        orgId: 1
        folder: Aeron Cache
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
