apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "aeroncache-monolith.fullname" . }}-test-connection"
  labels:
    {{- include "aeroncache-monolith.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "aeroncache-monolith.fullname" . }}:{{ .Values.ports.http }}/liveness/']
  restartPolicy: Never
