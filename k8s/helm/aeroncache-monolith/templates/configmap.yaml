apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.aeroncacheMonolithConfigmap }}
  namespace: {{ .Release.namespace }}
data:
  # Single-node monolith: the embedded cluster and every interface live in the same pod and
  # talk to each other over localhost.
  CLUSTER_NODE: "0"
  CLUSTER_ADDRESSES: "localhost"
  EGRESS_IP: "localhost"
  POD_ADDRESS: "localhost"
  REQUEST_PUB_HOST: "localhost"
  HTTP_RESPONSE_PUB_HOST: "localhost"
  WS_RESPONSE_PUB_HOST: "localhost"
  SSE_RESPONSE_PUB_HOST: "localhost"
  CACHE_MODE: {{ tpl .Values.cacheMode . | quote }}
  # Main launches the embedded media driver at AERON_DIR; the interfaces attach to it as clients
  # (LAUNCH_EMBEDDED=false) instead of each launching their own.
  LAUNCH_EMBEDDED: "false"
  AERON_DIR: "aeron"
  CLUSTER_FOLDER: "node0/cluster/"
  DYNAMIC_CACHE_CREATION: "false"
  WEBSOCKET_GATEWAY_ENABLED: {{ .Values.websocketEnabled | quote }}
  SSE_GATEWAY_ENABLED: {{ .Values.sseEnabled | quote }}
  AERON_GATEWAY_ENABLED: {{ .Values.aeronGatewayEnabled | quote }}
  GATEWAY_TRANSPORT_MEDIA: {{ tpl .Values.gatewayTransportMedia . | quote }}
  {{- if .Values.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ tpl .Values.corsAllowedOrigins . | quote }}
  {{- end }}
  {{- if .Values.idleStrategy }}
  IDLE_STRATEGY: {{ tpl .Values.idleStrategy . | quote }}
  {{- end }}
