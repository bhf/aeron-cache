openapi: 3.0.1
info:
  title: Aeron Cache HTTP API
  description: This API exposes endpoints to interact with Aeron Cache.
  termsOfService: https://www.github.com/bhf
  contact:
    name: Sanjeev
    url: https://www.sanjeev.pages.dev
    email: na@na.com
  license:
    name: MIT License
    url: https://choosealicense.com/licenses/mit/
  version: '1.0'
servers:
  - url: http://localhost:7070
    description: Dev server
paths:
  /api/v1/cache:
    post:
      tags:
        - CreateCache
      summary: Create a new cache
      description: Create a cache by specifying the cache Id in the request body
      operationId: createCache
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cache/bulkops:
    post:
      tags:
        - BulkOps
      summary: Perform bulk cache operations
      description: Execute multiple cache operations in a single request.
      operationId: bulkOps
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCacheOpsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCacheOpsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cache/{cacheId}:
    get:
      tags:
        - GetCache
      summary: Get all items from a cache
      description: Get all items from the specified cache
      operationId: getCache
      parameters:
        - name: cacheId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the cache
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GetCacheResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - PutItem
      summary: Put an item into a cache
      description: Put an item on the specified key into the specified cache
      operationId: putItem
      parameters:
        - name: cacheId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the cache
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutItemRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PutItemResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - DeleteCache
      summary: Delete a cache
      description: Delete the cache specified by it's Id
      operationId: deleteCache
      parameters:
        - name: cacheId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the cache
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeleteCacheResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - ClearCache
      summary: Clear a cache
      description: Clear the cache specified by it's Id
      operationId: clearCache
      parameters:
        - name: cacheId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the cache
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClearCacheResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cache/timed/{cacheId}:
    post:
      tags:
        - PutItem
      summary: Put a timed item into a cache
      description: Put an item with a TTL on the specified key into the specified cache
      operationId: putTimedItem
      parameters:
        - name: cacheId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the cache
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutTimedItemRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PutItemResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cache/{cacheId}/{key}:
    get:
      tags:
        - GetItem
      summary: Get an item from a cache
      description: Get an item by it's key from the specified cache
      operationId: getItem
      parameters:
        - name: cacheId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the cache
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key of the item
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GetItemResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - DeleteItem
      summary: Delete an item from a cache
      description: Delete an item by it's key from the specified cache
      operationId: deleteItem
      parameters:
        - name: cacheId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the cache
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key of the item
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeleteItemResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - PatchItem
      summary: Patch an item in a cache
      description: Deep-merge the supplied value into an existing item in the specified cache
      operationId: patchItem
      parameters:
        - name: cacheId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the cache
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key of the item
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchItemRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatchItemResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cache/{cacheId}/{key}/cancel-removal:
    post:
      tags:
        - CancelItemRemoval
      summary: Cancel a scheduled removal of an item from a cache
      description: Cancel a previously scheduled TTL/expiry removal of an item in the specified cache
      operationId: cancelItemRemoval
      parameters:
        - name: cacheId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the cache
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key of the item
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CancelItemRemovalResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/caches:
    get:
      tags:
        - GetCaches
      summary: Get all caches
      description: Get the details of all available caches
      operationId: getCaches
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CacheDetails'
  /api/v1/stats:
    get:
      tags:
        - Stats
      summary: Get cache status
      description: Get global stats from the Aeron cache
      operationId: getStats
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CacheStatsResponse'
  /api/v1/shutdown:
    post:
      tags:
        - ClusterTools
      summary: Shutdown Cluster
      description: Shutdown the cluster
      operationId: shutdownCluster
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusterToolsResponse'
  /api/v1/snapshot:
    post:
      tags:
        - ClusterTools
      summary: Take Snapshot
      description: Take a cluster snapshot
      operationId: takeSnapshot
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClusterToolsResponse'
  /liveness/:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Check if the application is live
      operationId: getLiveness
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /readiness/:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Check if the application is ready
      operationId: getReadiness
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        errorMsg:
          type: string
          example: 'Details about the error that occurred'
        helpMsg:
          type: string
          example: 'A user friendly help message'
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
    CreateRequest:
      type: object
      properties:
        cacheId:
          type: string
          example: "SomeCacheID"
    CreateResponse:
      type: object
      properties:
        cacheId:
          type: string
          example: "CreatedCache"
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
    GetCacheResponse:
      type: object
      properties:
        cacheId:
          type: string
          example: "CreatedCache"
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CacheItem'
    CacheItem:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    ClearCacheResponse:
      type: object
      properties:
        cacheId:
          type: string
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
    CacheDetails:
      type: object
      properties:
        cacheId:
          type: string
        itemCount:
          type: integer
          format: int64
    CacheStatsResponse:
      type: object
      properties:
        totalOpsCount:
          type: integer
          format: int32
        totalCachesCount:
          type: integer
          format: int32
        totalItemsCount:
          type: integer
          format: int32
        errorCount:
          type: integer
          format: int32
    ClusterToolsResponse:
      type: object
      properties:
        tool:
          type: string
        clusterFolder:
          type: string
        exitCode:
          type: integer
          format: int32
    PutItemRequest:
      type: object
      properties:
        key:
          type: string
          example: 'SomeRandomKey'
        value:
          type: string
          example: 'SomeRandomValue'
    PutTimedItemRequest:
      type: object
      properties:
        key:
          type: string
          example: 'SomeRandomKey'
        value:
          type: string
          example: 'SomeRandomValue'
        ttl:
          type: integer
          format: int64
          example: 60000
    PutItemResponse:
      type: object
      properties:
        cacheId:
          type: string
          example: "SomeCacheID"
        key:
          type: string
          example: 'SomeRandomKey'
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
    PatchItemRequest:
      type: object
      properties:
        value:
          type: string
          example: '{"field":"newValue"}'
    PatchItemResponse:
      type: object
      properties:
        cacheId:
          type: string
          example: "SomeCacheID"
        key:
          type: string
          example: 'SomeRandomKey'
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
    DeleteCacheResponse:
      type: object
      properties:
        cacheId:
          type: string
          example: "SomeCacheID"
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
    GetItemResponse:
      type: object
      properties:
        cacheId:
          type: string
          example: "SomeCacheID"
        key:
          type: string
          example: 'SomeRandomKey'
        value:
          type: string
          example: 'SomeRandomValue'
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
    DeleteItemResponse:
      type: object
      properties:
        cacheId:
          type: string
          example: "SomeCacheID"
        key:
          type: string
          example: 'SomeRandomKey'
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
    CancelItemRemovalResponse:
      type: object
      properties:
        cacheId:
          type: string
          example: "SomeCacheID"
        key:
          type: string
          example: 'SomeRandomKey'
        operationStatus:
          $ref: '#/components/schemas/CacheOperationStatus'
    BulkCacheOpsRequest:
      type: object
      properties:
        requestId:
          type: string
        operations:
          type: array
          items:
            $ref: '#/components/schemas/CacheOperationRequest'
    CacheOperationRequest:
      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/BulkOperationType'
        ttl:
          type: integer
          format: int64
        counterValue:
          type: integer
          format: int64
        requestId:
          type: string
        cacheId:
          type: string
        key:
          type: string
        value:
          type: string
    BulkOperationType:
      type: string
      enum:
        - NONE
        - CREATE_CACHE
        - ADD_ITEM
        - REMOVE_ITEM
        - CLEAR_CACHE
        - GET_ITEM
        - DELETE_CACHE
        - CREATE_COUNTER_CACHE
        - ADD_COUNTER
        - REMOVE_COUNTER
        - CLEAR_COUNTER_CACHE
        - GET_COUNTER
        - DELETE_COUNTER_CACHE
        - INCREMENT_COUNTER
        - DECREMENT_COUNTER
        - SET_COUNTER
    BulkCacheOpsResponse:
      type: object
      properties:
        requestId:
          type: string
        operationResponses:
          type: array
          items:
            $ref: '#/components/schemas/CacheOperationResponse'
    CacheOperationResponse:
      type: object
      properties:
        requestId:
          type: string
        status:
          $ref: '#/components/schemas/CacheOperationStatus'
        cacheId:
          type: string
        key:
          type: string
        value:
          type: string
    CacheOperationStatus:
      type: string
      enum:
        - NONE
        - SUCCESS
        - ERROR
        - UNKNOWN_CACHE
        - UNKNOWN_KEY
        - CACHE_EXISTS
        - DUPLICATE_SUBSCRIPTION
        - UNKNOWN_SUBSCRIPTION


