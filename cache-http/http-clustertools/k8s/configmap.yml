apiVersion: v1
kind: ConfigMap
metadata:
  name: aeroncache-http-clustertools-config
data:
  DNS_DELAY: "true"
  CLUSTER_ADDRESSES: "aeroncache-cluster-0.aeroncache-cluster.default.svc.cluster.local,aeroncache-cluster-1.aeroncache-cluster.default.svc.cluster.local,aeroncache-cluster-2.aeroncache-cluster.default.svc.cluster.local"
  # Cluster data directory the ClusterTool commands operate on (shared with the co-located node).
  CLUSTER_FOLDER: "/tmp/data/node0/cluster"
  # Archive directory whose old log segments are purged and whose size is reported via snapshot-info.
  # Defaults to a sibling `archive` dir next to CLUSTER_FOLDER when unset.
  ARCHIVE_DIR: "/tmp/data/node0/archive"
  # Aeron media driver directory shared with the node (the node's AERON_DIR). Required for the
  # in-process Archive client to reach the node's archive over its IPC local control channel.
  AERON_DIR: "/dev/shm/aeron"
  # Scheduled snapshot + purge. Disabled by default; enable to periodically snapshot then reclaim disk.
  SNAPSHOT_SCHEDULE_ENABLED: "false"
  # How often the scheduled snapshot + purge runs (ISO-8601 duration).
  SNAPSHOT_INTERVAL: "PT6H"
  # Number of most recent snapshots whose log history is retained; the purge never removes log
  # segments newer than the Nth most recent snapshot, leaving room for follower catch-up and for
  # invalidate-latest-snapshot rollback.
  SNAPSHOT_RETENTION_COUNT: "2"